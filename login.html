<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Valexa</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="section">
    <div class="container">
      <div class="form-card">
        <h1 style="font-size:1.5rem;">Log in to Valexa</h1>
        <p class="text-muted" style="margin-bottom:22px;">Track your cashback and manage your account.</p>

        <div id="login-message" class="form-message" hidden></div>

        <form id="login-form">
          <div class="form-field">
            <label for="email">Email address</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <p class="form-foot">New to Valexa? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  renderLayout("");
  if (getCurrentUser()) window.location.href = "dashboard.html";

  const form = document.getElementById("login-form");
  const msgEl = document.getElementById("login-message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearFormMessage(msgEl);
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;

    const result = await loginUser({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });

    submitBtn.disabled = false;
    if (!result.ok) {
      showFormMessage(msgEl, result.error);
      return;
    }
    const next = new URLSearchParams(window.location.search).get("next");
    window.location.href = next || "dashboard.html";
  });
</script>
</body>
</html>
