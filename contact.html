<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact & Support — Valexa</title>
<meta name="description" content="Get in touch with Valexa support for help with cashback tracking, your account, or partner offers.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1>Contact &amp; Support</h1>
      <p class="text-muted">Questions about a cashback offer, your account, or something that isn't tracking right — we're here for it.</p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-grid">
      <div>
        <h2>Send a message</h2>
        <form id="contact-form">
          <div class="form-field" id="field-name">
            <label for="c-name">Full name</label>
            <input type="text" id="c-name" required>
            <p class="field-error">Enter your name.</p>
          </div>
          <div class="form-field" id="field-email">
            <label for="c-email">Email address</label>
            <input type="email" id="c-email" required>
            <p class="field-error">Enter a valid email address.</p>
          </div>
          <div class="form-field" id="field-subject">
            <label for="c-subject">Subject</label>
            <input type="text" id="c-subject" required>
            <p class="field-error">Let us know what this is about.</p>
          </div>
          <div class="form-field" id="field-message">
            <label for="c-message">Message</label>
            <textarea id="c-message" rows="5" required></textarea>
            <p class="field-error">Add a few details so we can help.</p>
          </div>
          <div id="contact-message" class="form-message" hidden></div>
          <button type="submit" class="btn btn-primary btn-block">Send message</button>
        </form>
      </div>

      <div>
        <div class="contact-info-card">
          <h2 style="margin-top:0;">Reach us directly</h2>
          <dl id="contact-info"></dl>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  renderLayout("contact");

  const infoEl = document.getElementById("contact-info");
  const rows = [
    ["Email", VALEXA_CONFIG.supportEmail],
    ["Phone", VALEXA_CONFIG.phone],
    ["Address", VALEXA_CONFIG.address],
    ["Opening hours", VALEXA_CONFIG.openingHours],
  ].filter(([, value]) => value);
  infoEl.innerHTML = rows.map(([label, value]) => `<dt>${label}</dt><dd>${value}</dd>`).join("");

  const form = document.getElementById("contact-form");
  const msgEl = document.getElementById("contact-message");

  function setFieldError(fieldId, hasError) {
    document.getElementById(fieldId).classList.toggle("has-error", hasError);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    clearFormMessage(msgEl);

    const name = document.getElementById("c-name").value.trim();
    const email = document.getElementById("c-email").value.trim();
    const subject = document.getElementById("c-subject").value.trim();
    const message = document.getElementById("c-message").value.trim();

    let valid = true;
    setFieldError("field-name", name.length < 2); if (name.length < 2) valid = false;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    setFieldError("field-email", !emailOk); if (!emailOk) valid = false;
    setFieldError("field-subject", subject.length < 3); if (subject.length < 3) valid = false;
    setFieldError("field-message", message.length < 10); if (message.length < 10) valid = false;

    if (!valid) {
      showFormMessage(msgEl, "Please fix the highlighted fields.");
      return;
    }

    showFormMessage(msgEl, "Your message has been sent. Our support team will get back to you by email.", "success");
    form.reset();
  });
</script>
</body>
</html>
