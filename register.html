<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Valexa</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="section">
    <div class="container">
      <div class="form-card">
        <h1 style="font-size:1.5rem;">Create your free account</h1>
        <p class="text-muted" style="margin-bottom:22px;">Takes under a minute. No purchase required.</p>

        <div id="register-message" class="form-message" hidden></div>

        <form id="register-form">
          <div class="form-field">
            <label for="name">Full name</label>
            <input type="text" id="name" required autocomplete="name">
          </div>
          <div class="form-field">
            <label for="email">Email address</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="form-field">
            <label for="phone">Mobile number (optional)</label>
            <input type="tel" id="phone" placeholder="10-digit number" autocomplete="tel">
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="new-password">
            <p class="form-hint">At least 8 characters.</p>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  renderLayout("");
  if (getCurrentUser()) window.location.href = "dashboard.html";

  const form = document.getElementById("register-form");
  const msgEl = document.getElementById("register-message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearFormMessage(msgEl);
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;

    const result = await registerUser({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      password: document.getElementById("password").value,
    });

    submitBtn.disabled = false;
    if (!result.ok) {
      showFormMessage(msgEl, result.error);
      return;
    }
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
