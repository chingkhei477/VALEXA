<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories — Valexa</title>
<meta name="description" content="Browse Valexa cashback offers by category — fashion, electronics, travel, food, groceries, finance and more.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1>Categories</h1>
      <p class="text-muted">Pick a category to see every partner store offering cashback in it.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="category-grid" id="all-categories"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  renderLayout("categories");
  const wrap = document.getElementById("all-categories");
  VALEXA_CATEGORIES.forEach((cat) => {
    const count = VALEXA_OFFERS.filter((o) => o.category === cat.id).length;
    wrap.insertAdjacentHTML("beforeend", `
      <a class="category-card" href="offers.html?category=${cat.id}">
        <span class="icon-wrap">${categoryIconSVG(cat.icon)}</span>
        <span class="cat-name">${cat.name}</span>
        <span class="text-muted" style="font-size:0.82rem;">${count} offer${count === 1 ? "" : "s"}</span>
      </a>`);
  });
</script>
</body>
</html>
