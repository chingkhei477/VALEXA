<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashback Offers — Valexa</title>
<meta name="description" content="Browse and search live cashback offers from Valexa's partner stores across fashion, electronics, travel, food and more.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1>Cashback Offers</h1>
      <p class="text-muted">Search by store or filter by category to find your cashback rate.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="offers-toolbar">
        <input type="search" id="offer-search" placeholder="Search by store name, e.g. Urban Threads" aria-label="Search offers">
        <select id="category-filter" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="offer-grid" id="offer-results"></div>
      <div class="empty-state" id="empty-state" hidden>No offers match your search. Try a different store name or category.</div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/offers.js"></script>
</body>
</html>
